[project]
name = "ee5130-mnist-webapp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn==1.9.1",
    "pillow>=10.0.0",
    "joblib>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "torch==2.14.0",
]

[tool.vercel]
entrypoint = "webapp.app:app"

[tool.uv]
package = false
environments = ["sys_platform == 'linux' or sys_platform == 'win32'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
